[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coherent-qru-oracle"
version = "1.0.0"
description = "Reproduction of coherent QRU score-oracle composition experiments"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.17.0", "matplotlib==3.10.8", "qiskit==1.4.6", "qiskit-aer==0.17.2", "cvxpy==1.9.3", "clarabel==0.11.1", "pytest==9.1.1", "nbformat==5.11.1", "nbconvert==7.17.1", "ipykernel==7.4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.*MCXGate.get_num_ancilla_qubits.*:PendingDeprecationWarning", "ignore:.*MCXVChain.*:PendingDeprecationWarning", "ignore:.*MCXRecursive.*:PendingDeprecationWarning"]
