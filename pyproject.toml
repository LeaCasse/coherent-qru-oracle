[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coherent-qru-oracle"
version = "1.1.0"
description = "Workspace contracts for coherent score oracles"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.5", "scipy==1.18.1", "matplotlib==3.10.8", "qiskit==1.4.6", "qiskit-aer==0.17.2", "cvxpy==1.9.3", "clarabel==0.11.1", "scs==3.3.2"]

[project.optional-dependencies]
test = ["pytest==9.2.0"]
notebook = ["nbformat>=5.10,<6", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:.*MCXGate.get_num_ancilla_qubits.*:PendingDeprecationWarning", "ignore:.*MCXVChain.*:PendingDeprecationWarning", "ignore:.*MCXRecursive.*:PendingDeprecationWarning"]
